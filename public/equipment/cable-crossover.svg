<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img">
  <title>케이블 크로스오버</title>
  <rect width="240" height="160" rx="12" fill="#eef1f5"/>
  <g stroke="#212529" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- 바닥 다리 (바깥으로 벌어진 받침) -->
    <path d="M12 143 L22 135 H70 V143 Z" fill="#495057"/>
    <path d="M228 143 L218 135 H170 V143 Z" fill="#495057"/>

    <!-- 바깥 기둥(구멍 뚫린 프레임) -->
    <rect x="22" y="24" width="8" height="112" rx="2" fill="#6c757d"/>
    <rect x="210" y="24" width="8" height="112" rx="2" fill="#6c757d"/>

    <!-- 안쪽 레일 (손잡이 높이를 옮기는 은색 기둥) -->
    <rect x="56" y="24" width="8" height="112" rx="2" fill="#ced4da"/>
    <rect x="176" y="24" width="8" height="112" rx="2" fill="#ced4da"/>

    <!-- 위 가로대 -->
    <rect x="18" y="16" width="204" height="10" rx="3" fill="#495057"/>

    <!-- 가운데 턱걸이 바 -->
    <path d="M90 36 L98 28 H142 L150 36" fill="none" stroke-width="4"/>
    <path d="M90 36 L98 28 H142 L150 36" fill="none" stroke="#adb5bd" stroke-width="2"/>

    <!-- 중량 판(웨이트 스택) -->
    <rect x="33" y="92" width="20" height="42" rx="2" fill="#343a40"/>
    <rect x="187" y="92" width="20" height="42" rx="2" fill="#343a40"/>
  </g>
  <!-- 스택 줄무늬 -->
  <g stroke="#6c757d" stroke-width="1.5">
    <path d="M35 99h16M35 106h16M35 113h16M35 120h16M35 127h16"/>
    <path d="M189 99h16M189 106h16M189 113h16M189 120h16M189 127h16"/>
  </g>

  <!-- 케이블: 웨이트 스택 → 위 도르래 → 위치 조절 도르래 → 손잡이 -->
  <g stroke="#212529" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M43 92 V33"/>
    <path d="M197 92 V33"/>
    <path d="M49 28 H60 V52"/>
    <path d="M191 28 H180 V52"/>
    <path d="M62 58 L93 102"/>
    <path d="M178 58 L147 102"/>
  </g>

  <!-- 위 도르래 -->
  <g fill="#e9ecef" stroke="#212529" stroke-width="2">
    <circle cx="43" cy="28" r="6"/>
    <circle cx="197" cy="28" r="6"/>
  </g>

  <!-- 위치 조절 도르래(레일을 오르내리는 검은 블록) -->
  <g stroke="#212529" stroke-width="2" stroke-linejoin="round">
    <rect x="53" y="46" width="14" height="14" rx="3" fill="#343a40"/>
    <rect x="173" y="46" width="14" height="14" rx="3" fill="#343a40"/>
  </g>
  <g fill="#e9ecef" stroke="#212529" stroke-width="1.5">
    <circle cx="60" cy="53" r="3.5"/>
    <circle cx="180" cy="53" r="3.5"/>
  </g>

  <!-- 손잡이 -->
  <g stroke-linecap="round">
    <path d="M90 99 L100 108" stroke="#212529" stroke-width="9"/>
    <path d="M90 99 L100 108" stroke="#e4572e" stroke-width="5"/>
    <path d="M150 99 L140 108" stroke="#212529" stroke-width="9"/>
    <path d="M150 99 L140 108" stroke="#e4572e" stroke-width="5"/>
  </g>
</svg>
